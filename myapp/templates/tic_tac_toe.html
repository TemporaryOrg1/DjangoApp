<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe!</title>
     <style>
        #tic-tac-toe-game {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            row-gap: 1px;
        }

        .tic-tac-toe-row {
            display: flex;
            flex-direction: row;
            column-gap: 1px;
        }

        .tic-tac-toe-row div {
            background-color: red;
            width: 68px;
            height: 68px;
            border: 4px dashed black;
        }
    </style>
</head>
<body>
    <button type="button" id="play-btn">Play</button>
    <div id="tic-tac-toe-game" hidden>
        <div class="tic-tac-toe-row" id="row-0">
            <div id="col-0a">
            </div>
            <div id="col-0b">
            </div>
            <div id="col-0c">
            </div>
        </div>
        <div class="tic-tac-toe-row" id="row-1">
            <div id="col-1a">
            </div>
            <div id="col-1b">
            </div>
            <div id="col-1c">
            </div>
        </div>
        <div class="tic-tac-toe-row" id="row-2">
            <div id="col-2a">
            </div>
            <div id="col-2b">
            </div>
            <div id="col-2c">
            </div>
        </div>
    </div>
</body>
</html>

<script>
    const playButton = document.querySelector("#play-btn");
    const gameContainer = document.querySelector("#tic-tac-toe-game");
    
    const board = [
        ["", "", ""],
        ["", "", ""],
        ["", "", ""]
    ];

    let currentPlayer = "X";

    function getCellElement(row, col) {
        return document.querySelector(`#col-${row}${String.fromCharCode(97 + col)}`); // a, b, c mapping
    }

    function updateBoard(row, col) {
        if (board[row][col] === "") {
            board[row][col] = currentPlayer;
            getCellElement(row, col).textContent = currentPlayer;
            
            currentPlayer = currentPlayer === "X" ? "O" : "X";
        }
    }

    function initializeGame() {
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                const cell = getCellElement(row, col);
                cell.addEventListener("click", () => updateBoard(row, col));
            }
        }
    }

    playButton.addEventListener("click", () => {
        console.log("Button clicked!");
        playButton.textContent = "Playing Tic Tac Toe...";
        playButton.disabled = true;
        gameContainer.hidden = false;
        initializeGame();
    });
</script>
